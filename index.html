<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finger App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Finger App</h1>
      <p class="subtitle">하루 활동 기록</p>

      <section class="card">
        <h2>사용자</h2>
        <div class="row">
          <input id="username" type="text" placeholder="이름 또는 별명 입력" />
          <button id="saveUser" type="button">저장</button>
        </div>
        <p id="activeUser" class="hint"></p>
      </section>

      <section class="card">
        <h2>오늘의 활동</h2>
        <form id="recordForm">
          <label><input type="checkbox" name="activity" value="사회관계 유지" /> 사회관계 유지</label>
          <label><input type="checkbox" name="activity" value="영양 섭취 관리" /> 영양 섭취 관리</label>
          <label><input type="checkbox" name="activity" value="인지 훈련" /> 인지 훈련</label>
          <label><input type="checkbox" name="activity" value="혈압 관리" /> 혈압 관리</label>
          <label><input type="checkbox" name="activity" value="운동" /> 운동</label>

          <label for="memo">메모 (선택)</label>
          <textarea id="memo" rows="3" placeholder="간단한 메모를 남겨보세요"></textarea>

          <button type="submit">기록 저장</button>
        </form>
      </section>

      <section class="card">
        <h2>기록 내역</h2>
        <ul id="records"></ul>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
